[package]
    name = "mod-dev"
    version = "1.3.7"
    authors = [
        "Paul-16098",
    ]
    license = "MIT"
    readme = "./README.md"
    homepage = "https://github.com/Paul-16098/rust-mod-dev"
    repository = "https://github.com/Paul-16098/rust-mod-dev"
    edition = "2024"
    description = "一個用於處理和打包 MOD 文件的 Rust 工具。"
    [package.metadata.i18n]
        default-locale = "en"
        load-path      = "locales"

[dependencies]
    glob = "0.3.3"
    serde_json = "1.0.145"
    serde = { version = "1.0.228", features = [
        "derive",
    ] }
    zip = "^6.0.0"
    zip-extensions = "0.13.0"
    walkdir = "2.5.0"
    colog = "1.4.0"
    log = "0.4.29"
    rust-i18n = "3.1.5"
    config = "0.15.19"
    nest_struct = "0.5.5"
    clap = { version = "4.5.53", features = [
        "derive",
    ] }
    human-panic = "2.0.4"
    lazy_static = "1.5.0"
    dialoguer = "0.12.0"

[dev-dependencies]
    tempfile = "3.23.0"
